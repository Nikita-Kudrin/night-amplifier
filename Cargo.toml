[package]
name = "night_amplifier"
version = "0.0.0-dev"
edition = "2021"
authors = ["Night Amplifier Contributors"]
description = "Professional-grade EAA (Electronically Assisted Astronomy) live stacking engine"
license-file = "LICENSE"
publish = false
readme = "README.md"

[lib]
name = "night_amplifier"
path = "src/lib.rs"

[[bin]]
name = "night_amplifier"
path = "src/main.rs"

[dependencies]
thiserror = "2.0.20"
rayon = "1.12.0"
wide = "1.6.1"  # SIMD abstractions for performance-critical code

# Embedded web frontend assets for single-binary distribution
rust-embed = "8.12"
mime_guess = "2.0.5"
nalgebra = "0.35.0"  # Linear algebra for RBF background extraction
async-trait = "0.1.92"
process-wrap = { version = "9.1.0", features = ["std", "tokio1"] }
# Optional: ZWO ASI camera support
# Now loaded at runtime via dlopen - no compile-time linking needed

# Web server dependencies
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["fs", "cors"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# INDI protocol dependencies
quick-xml = { version = "0.41.0", features = ["serialize"], optional = true }
base64 = { version = "0.23.1", optional = true }


# FITS file support for astronomical image storage
fitsio = "0.21.10"

# Date/time formatting for session directories
chrono = "0.4.45"

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tracing-appender = "0.2.5"

# OpenTelemetry (optional, enabled by default in debug builds)
opentelemetry = { version = "0.32.0", optional = true }
opentelemetry_sdk = { version = "0.32.1", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.32.0", features = ["grpc-tonic"], optional = true }
opentelemetry-semantic-conventions = { version = "0.32.1", optional = true }
tracing-opentelemetry = { version = "0.33.0", optional = true }

# Image encoding for streaming
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }

# LZ4 compression for high-quality RGB16 streaming
lz4_flex = "0.14.0"

# JPEG compression for high-speed dynamic resolution streaming
turbojpeg = "1.5.1"

# Image file format support for simulated camera
tiff = "0.11.3"
png = "0.18.1"
zune-png = "0.5.2"

# ASTAP installer dependencies
reqwest = { version = "0.13.4", default-features = false, features = ["stream", "cookies", "rustls"] }
futures-util = "0.3.33"
zip = "8.2.0"
regex = "1.13.1"
urlencoding = "2.1.3"
dlopen2 = "0.8.2"
bytes = "1.12.1"


[features]
default = ["playerone", "zwo", "indi", "qhy", "touptek", "svbony"]
playerone = []
zwo = []
qhy = []
touptek = []
svbony = []
indi = ["dep:quick-xml", "dep:base64"]
# Bundle cfitsio from source (static link) for portable distribution.
# Without this, the system libcfitsio-dev is required.
bundled-cfitsio = ["fitsio/fitsio-src"]
# OpenTelemetry support - enabled by default in debug builds via cfg
telemetry = ["opentelemetry", "opentelemetry_sdk", "opentelemetry-otlp", "opentelemetry-semantic-conventions", "tracing-opentelemetry"]

[dev-dependencies]
criterion = "0.8.2"
tiff = "0.11.3"        # TIFF file reading
fitsio = "0.21.10"     # FITS file reading (astronomy format)
tempfile = "3.27.0"   # For creating temporary test outputs
image = "0.25.10"      # General image handling for test output
tower = "0.5.3"       # For server endpoint testing (ServiceExt::oneshot)
serial_test = "4.0.1" # Run integration tests sequentially
proptest = "1.11.0"
insta = "1.48.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Release codegen with symbols retained, so `perf` can attribute samples to
# functions. `strip = true` on the release profile otherwise leaves the binary
# with no symbol table and profiles show raw addresses.
[profile.profiling]
inherits = "release"
strip = false
debug = 1

[[bench]]
name = "debayer_benchmark"
harness = false

[[bench]]
name = "warp_benchmark"
harness = false

[[bench]]
name = "background_benchmark"
harness = false

[[bench]]
name = "disk_writer_benchmark"
harness = false

[[bench]]
name = "encoding_benchmark"
harness = false

[[bench]]
name = "render_benchmark"
harness = false

