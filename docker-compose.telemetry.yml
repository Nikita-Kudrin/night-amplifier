services:
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"   # Jaeger UI (traces)

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4317:4317"     # OTLP gRPC receiver (app sends here)
    depends_on:
      - jaeger
    # night_amplifier defaults to sending traces/metrics to http://localhost:4317,
    # which only works when the app runs on THIS SAME machine as this compose
    # stack. If the app runs elsewhere (e.g. the Orange Pi, while this stack runs
    # on your workstation), point it at this host's LAN IP instead:
    #   night_amplifier --telemetry --otlp-endpoint http://<this-host-ip>:4317
    # or set OTEL_EXPORTER_OTLP_ENDPOINT=http://<this-host-ip>:4317 in its
    # environment. Otherwise every export silently fails with connection-refused
    # and nothing shows up in Jaeger/Prometheus/Grafana below.

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"     # Prometheus UI (metrics)
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"     # Grafana UI (dashboards)
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    depends_on:
      - prometheus
