name: CI

env:
  INSTALL_TIMEOUT: '15'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  pull_request:
    branches: [ "main" ]

jobs:
  rust-build-all:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        timeout-minutes: ${{ fromJSON(env.INSTALL_TIMEOUT) }}
        run: |
          sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' /etc/apt/sources.list.d/ubuntu.sources || true
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout="20" -o Acquire::https::Timeout="20"
          sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout="20" -o Acquire::https::Timeout="20" nasm libusb-1.0-0-dev libclang-dev libcfitsio-dev
      - name: Install nextest
        timeout-minutes: ${{ fromJSON(env.INSTALL_TIMEOUT) }}
        uses: taiki-e/install-action@nextest
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Archive tests
        run: cargo nextest archive --archive-file tests.tar.zst --no-default-features
      - name: Build benchmarks
        run: cargo bench --no-run --no-default-features
      - name: Archive benchmark binaries
        run: |
          mkdir -p bench-binaries
          for bin in target/release/deps/*benchmark*; do
            if [ -x "$bin" ] && [ ! -d "$bin" ] && [[ ! "$bin" == *.d ]]; then
              cp "$bin" bench-binaries/
            fi
          done
          tar czf bench-binaries.tar.gz bench-binaries/
      - name: Upload Test Archive
        uses: actions/upload-artifact@v7
        with:
          name: tests-archive
          path: tests.tar.zst
          retention-days: 1
      - name: Upload Benchmark Binaries
        uses: actions/upload-artifact@v7
        with:
          name: bench-binaries-archive
          path: bench-binaries.tar.gz
          retention-days: 1
  
  rust-unit-tests:
    needs: rust-build-all
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        timeout-minutes: ${{ fromJSON(env.INSTALL_TIMEOUT) }}
        run: |
          sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' /etc/apt/sources.list.d/ubuntu.sources || true
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout="20" -o Acquire::https::Timeout="20"
          sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout="20" -o Acquire::https::Timeout="20" nasm libusb-1.0-0-dev libclang-dev libcfitsio-dev
      - name: Install nextest
        timeout-minutes: ${{ fromJSON(env.INSTALL_TIMEOUT) }}
        uses: taiki-e/install-action@nextest
      # `web/dist/` is git-ignored, and in a debug build rust-embed reads it from disk
      # at run time rather than from the test archive — so the bundle has to be built
      # in the job that *runs* the tests, not the one that compiles them.
      - name: Setup Node.js
        timeout-minutes: ${{ fromJSON(env.INSTALL_TIMEOUT) }}
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Build the frontend bundle
        timeout-minutes: ${{ fromJSON(env.INSTALL_TIMEOUT) }}
        working-directory: ./web
        run: |
          npm ci
          npm run build
      - name: Download Archive
        uses: actions/download-artifact@v8
        with:
          name: tests-archive
      - name: Run unit tests
        run: cargo nextest run --archive-file tests.tar.zst -E 'not (binary(integration_pipeline) or binary(pro_gating_test))'
  
  rust-integration-tests:
    needs: rust-build-all
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        timeout-minutes: ${{ fromJSON(env.INSTALL_TIMEOUT) }}
        run: |
          sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' /etc/apt/sources.list.d/ubuntu.sources || true
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout="20" -o Acquire::https::Timeout="20"
          sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout="20" -o Acquire::https::Timeout="20" nasm libusb-1.0-0-dev libclang-dev libcfitsio-dev
      - name: Install nextest
        timeout-minutes: ${{ fromJSON(env.INSTALL_TIMEOUT) }}
        uses: taiki-e/install-action@nextest
      - name: Download Archive
        uses: actions/download-artifact@v8
        with:
          name: tests-archive
      - name: Run integration tests
        run: cargo nextest run --archive-file tests.tar.zst -E 'binary(integration_pipeline)' --run-ignored all --test-threads 1 --partition hash:${{ matrix.partition }}/4
  
  rust-benchmarks:
    needs: rust-build-all
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:

      - name: Install dependencies
        timeout-minutes: ${{ fromJSON(env.INSTALL_TIMEOUT) }}
        run: |
          sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' /etc/apt/sources.list.d/ubuntu.sources || true
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout="20" -o Acquire::https::Timeout="20"
          sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout="20" -o Acquire::https::Timeout="20" nasm libusb-1.0-0-dev libclang-dev libcfitsio-dev
      - name: Download Benchmark Binaries
        uses: actions/download-artifact@v8
        with:
          name: bench-binaries-archive
      - name: Run benchmarks
        run: |
          tar xzf bench-binaries.tar.gz
          for bin in bench-binaries/*; do
            if [ -x "$bin" ]; then
              echo "=== Running $(basename $bin) ==="
              "$bin" --bench
            fi
          done
  
  rust-coverage:
    needs: rust-build-all
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        timeout-minutes: ${{ fromJSON(env.INSTALL_TIMEOUT) }}
        run: |
          sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' /etc/apt/sources.list.d/ubuntu.sources || true
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout="20" -o Acquire::https::Timeout="20"
          sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout="20" -o Acquire::https::Timeout="20" nasm libusb-1.0-0-dev libclang-dev libcfitsio-dev
      - name: Install cargo-llvm-cov
        timeout-minutes: ${{ fromJSON(env.INSTALL_TIMEOUT) }}
        uses: taiki-e/install-action@cargo-llvm-cov
      # `web/dist/` is git-ignored, and in a debug build rust-embed reads it from disk
      # at run time rather than from the test archive — so the bundle has to be built
      # in the job that *runs* the tests, not the one that compiles them.
      - name: Setup Node.js
        timeout-minutes: ${{ fromJSON(env.INSTALL_TIMEOUT) }}
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Build the frontend bundle
        timeout-minutes: ${{ fromJSON(env.INSTALL_TIMEOUT) }}
        working-directory: ./web
        run: |
          npm ci
          npm run build
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Generate coverage
        run: |
          cargo llvm-cov --no-default-features --workspace --lcov --output-path lcov.info
          echo "### Rust Coverage" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cargo llvm-cov report >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: lcov.info

  
  web-tests-and-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        timeout-minutes: ${{ fromJSON(env.INSTALL_TIMEOUT) }}
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        timeout-minutes: ${{ fromJSON(env.INSTALL_TIMEOUT) }}
        working-directory: ./web
        run: npm ci
      - name: Run web unit tests
        working-directory: ./web
        run: npm run test:run
      - name: Run web linting
        working-directory: ./web
        run: npm run lint

  # Every other Rust job builds `--no-default-features`, which compiles no vendor provider
  # code: an ARM64-only type error and a Windows-only struct layout both reached a release.
  rust-vendor-providers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        timeout-minutes: ${{ fromJSON(env.INSTALL_TIMEOUT) }}
        run: |
          sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' /etc/apt/sources.list.d/ubuntu.sources || true
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout="20" -o Acquire::https::Timeout="20"
          sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout="20" -o Acquire::https::Timeout="20" nasm libusb-1.0-0-dev libclang-dev libcfitsio-dev
      - name: Install nextest
        timeout-minutes: ${{ fromJSON(env.INSTALL_TIMEOUT) }}
        uses: taiki-e/install-action@nextest
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Test vendor providers
        env:
          RUSTFLAGS: -D warnings
        run: cargo nextest run --lib --no-default-features --features playerone,zwo,qhy,touptek,svbony -E 'test(/^camera::/)'

  # ToupTek's structs are UTF-16 on Windows; a const assertion in its FFI types fails the
  # build when their layout drifts from toupcam.h.
  rust-vendor-providers-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Install system deps
        timeout-minutes: ${{ fromJSON(env.INSTALL_TIMEOUT) }}
        run: |
          choco install pkgconfiglite nasm
          vcpkg install cfitsio:x64-windows-static
          $vcpkg_path = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows-static"
          echo "PKG_CONFIG_PATH=$vcpkg_path/lib/pkgconfig" >> $env:GITHUB_ENV
          echo "CFITSIO_STATIC=1" >> $env:GITHUB_ENV
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Check vendor providers
        run: cargo check --lib --no-default-features --features playerone,zwo,qhy,touptek,svbony
