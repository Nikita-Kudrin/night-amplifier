name: CI

env:
  INSTALL_TIMEOUT: '15'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  pull_request:
    branches: [ "main" ]

jobs:
  # Tests (dev profile) and benchmarks (release, fat LTO) share almost no artifacts, so they
  # build in parallel jobs, each with its own rust-cache entry (keyed by job id).
  rust-build-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Free disk space
        uses: ./.github/actions/free-disk-space
      - name: Install dependencies
        timeout-minutes: ${{ fromJSON(env.INSTALL_TIMEOUT) }}
        uses: ./.github/actions/system-deps
      - name: Install nextest
        timeout-minutes: ${{ fromJSON(env.INSTALL_TIMEOUT) }}
        uses: taiki-e/install-action@nextest
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Archive tests
        run: cargo nextest archive --archive-file tests.tar.zst --no-default-features
      - name: Upload Test Archive
        uses: actions/upload-artifact@v7
        with:
          name: tests-archive
          path: tests.tar.zst
          retention-days: 1

  # Also hosts the feature checks: nothing waits on this job's artifacts but the benchmarks.
  rust-build-benches:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Free disk space
        uses: ./.github/actions/free-disk-space
      - name: Install dependencies
        timeout-minutes: ${{ fromJSON(env.INSTALL_TIMEOUT) }}
        uses: ./.github/actions/system-deps
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build benchmarks
        run: cargo bench --no-run --no-default-features
      # Nothing else compiles the telemetry feature; 1a243da broke it unnoticed for three days
      - name: Check telemetry build
        run: cargo check --lib --no-default-features --features telemetry
      # web/src/composables/api.types.js is written from the Rust wire types; fails when stale
      - name: Check api.types.js is current
        run: cargo test --no-default-features --features api-schema --test api_types
      - name: Pack benchmarks
        uses: ./.github/actions/pack-benchmarks
        with:
          artifact: bench-binaries-archive

  rust-unit-tests:
    needs: rust-build-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        timeout-minutes: ${{ fromJSON(env.INSTALL_TIMEOUT) }}
        uses: ./.github/actions/system-deps
      - name: Install nextest
        timeout-minutes: ${{ fromJSON(env.INSTALL_TIMEOUT) }}
        uses: taiki-e/install-action@nextest
      # `web/dist/` is git-ignored, and in a debug build rust-embed reads it from disk
      # at run time rather than from the test archive — so the bundle has to be built
      # in the job that *runs* the tests, not the one that compiles them.
      - name: Build the frontend bundle
        timeout-minutes: ${{ fromJSON(env.INSTALL_TIMEOUT) }}
        uses: ./.github/actions/setup-npm
        with:
          script: build
      - name: Download Archive
        uses: actions/download-artifact@v8
        with:
          name: tests-archive
      - name: Run unit tests
        run: cargo nextest run --archive-file tests.tar.zst -E 'not (binary(integration_pipeline) or binary(pro_gating_test))'

  rust-integration-tests:
    needs: rust-build-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        timeout-minutes: ${{ fromJSON(env.INSTALL_TIMEOUT) }}
        uses: ./.github/actions/system-deps
      - name: Install nextest
        timeout-minutes: ${{ fromJSON(env.INSTALL_TIMEOUT) }}
        uses: taiki-e/install-action@nextest
      - name: Download Archive
        uses: actions/download-artifact@v8
        with:
          name: tests-archive
      - name: Run integration tests
        run: cargo nextest run --archive-file tests.tar.zst -E 'binary(integration_pipeline)' --run-ignored all --test-threads 1 --partition hash:${{ matrix.partition }}/4

  rust-benchmarks:
    needs: rust-build-benches
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Only for the local actions; the benchmarks run prebuilt
      - uses: actions/checkout@v6
      - name: Install dependencies
        timeout-minutes: ${{ fromJSON(env.INSTALL_TIMEOUT) }}
        uses: ./.github/actions/system-deps
      - name: Run benchmarks
        uses: ./.github/actions/run-benchmarks
        with:
          artifact: bench-binaries-archive

  # Builds its own instrumented binaries, so it starts at once rather than behind a build job
  rust-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        timeout-minutes: ${{ fromJSON(env.INSTALL_TIMEOUT) }}
        uses: ./.github/actions/system-deps
      - name: Install cargo-llvm-cov
        timeout-minutes: ${{ fromJSON(env.INSTALL_TIMEOUT) }}
        uses: taiki-e/install-action@cargo-llvm-cov
      # The tests read `web/dist/` from disk, as in rust-unit-tests
      - name: Build the frontend bundle
        timeout-minutes: ${{ fromJSON(env.INSTALL_TIMEOUT) }}
        uses: ./.github/actions/setup-npm
        with:
          script: build
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Generate coverage
        run: |
          cargo llvm-cov --no-default-features --workspace --lcov --output-path lcov.info
          echo "### Rust Coverage" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cargo llvm-cov report >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: lcov.info


  web-tests-and-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install web dependencies
        timeout-minutes: ${{ fromJSON(env.INSTALL_TIMEOUT) }}
        uses: ./.github/actions/setup-npm
      - name: Run web unit tests
        working-directory: ./web
        run: npm run test:run
      - name: Run web linting
        working-directory: ./web
        run: npm run lint

  # Every other Rust job builds `--no-default-features`, which compiles no vendor provider
  # code: an ARM64-only type error and a Windows-only struct layout both reached a release.
  rust-vendor-providers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        timeout-minutes: ${{ fromJSON(env.INSTALL_TIMEOUT) }}
        uses: ./.github/actions/system-deps
      - name: Install nextest
        timeout-minutes: ${{ fromJSON(env.INSTALL_TIMEOUT) }}
        uses: taiki-e/install-action@nextest
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Test vendor providers
        env:
          RUSTFLAGS: -D warnings
        run: cargo nextest run --lib --no-default-features --features playerone,zwo,qhy,touptek,svbony,indi -E 'package(night_amplifier_core) and (test(/^camera::/) or test(/^indi::/))'

  # ToupTek's structs are UTF-16 on Windows; a const assertion in its FFI types fails the
  # build when their layout drifts from toupcam.h.
  rust-vendor-providers-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Install system deps
        timeout-minutes: ${{ fromJSON(env.INSTALL_TIMEOUT) }}
        uses: ./.github/actions/system-deps
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Check vendor providers
        run: cargo check --lib --no-default-features --features playerone,zwo,qhy,touptek,svbony,indi
